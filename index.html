<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تطبيق الحسابات والديون</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sync-bar" class="sync-bar">
        <div class="sync-status">
            <span id="sync-indicator" class="indicator green"></span>
            <span id="sync-text">محفوظ بالهاتف</span>
        </div>
        <div class="sync-actions">
            <button id="btn-export" class="btn-sync">📥 نسخ للهاتف</button>
            <button id="btn-import" class="btn-sync">📤 استعادة</button>
            <input type="file" id="file-import" accept=".json" style="display: none;">
        </div>
    </div>

    <div id="home-screen" class="screen active">
        <header class="main-header">
            <h1>العملاء (<span id="customers-count" class="en-font">0</span>)</h1>
        </header>

        <div class="totals-card">
            <div class="total-section gave">
                <p>أعطيت</p>
                <h2 dir="ltr" class="en-font">TRY <span id="total-gave">0</span></h2>
            </div>
            <div class="divider"></div>
            <div class="total-section took">
                <p>أخذت</p>
                <h2 dir="ltr" class="en-font">TRY <span id="total-took">0</span></h2>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 ابحث عن عميل...">
        </div>

        <div id="customers-list" class="customers-list">
            </div>

        <button id="fab-add-customer" class="fab">+</button>
    </div>

    <div id="add-customer-screen" class="screen hidden">
        <header class="sub-header">
            <button class="back-btn" onclick="app.showScreen('home-screen')">➔</button>
            <h2>إضافة عميل</h2>
            <button id="btn-fetch-contact" class="btn-text">📱 جلب جهة اتصال</button>
        </header>
        <div class="form-container">
            <div class="input-group">
                <label>اسم العميل</label>
                <input type="text" id="add-name" placeholder="أدخل اسم العميل">
            </div>
            
            <div class="input-group">
                <label>رقم الهاتف</label>
                <div class="phone-wrapper" dir="ltr">
                    <span class="country-code en-font">+90</span>
                    <input type="tel" id="add-phone" placeholder="5xxxxxxxxx" class="en-font">
                </div>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني (اختياري)</label>
                <input type="email" id="add-email">
            </div>
            <div class="input-group">
                <label>العنوان (اختياري)</label>
                <input type="text" id="add-address">
            </div>
            <button id="btn-save-customer" class="btn-primary block-btn">حفظ العميل</button>
        </div>
    </div>

    <div id="customer-profile-screen" class="screen hidden">
        <header class="sub-header">
            <button class="back-btn" onclick="app.showScreen('home-screen')">➔</button>
            <h2 id="profile-name">اسم العميل</h2>
            <div class="header-actions">
                <button id="btn-whatsapp" class="btn-icon whatsapp-btn">💬</button>
                <button id="btn-set-reminder" class="btn-icon">⏰</button>
            </div>
        </header>

        <div class="profile-balance">
            <h3>الرصيد الحالي</h3>
            <h1 id="profile-total-balance" dir="ltr" class="en-font">TRY 0</h1>
            <p id="profile-balance-status"></p>
        </div>

        <div class="action-buttons">
            <button class="btn-action gave-btn" onclick="app.openCalculator('gave')">أعطيت</button>
            <button class="btn-action took-btn" onclick="app.openCalculator('took')">أخذت</button>
        </div>

        <div id="transactions-list" class="transactions-list">
            </div>
    </div>

    <div id="calculator-screen" class="screen hidden">
        <header class="sub-header">
            <button class="back-btn" onclick="app.showScreen('customer-profile-screen')">✕</button>
            <h2 id="calc-title">أعطيت</h2>
        </header>
        
        <div class="calc-display-area">
            <h1 id="calc-display" dir="ltr" class="en-font">0</h1>
            <div class="calc-inputs">
                <input type="date" id="calc-date" class="en-font">
                <input type="text" id="calc-note" placeholder="التفاصيل (البضاعة، الكمية، الفاتورة...)">
            </div>
        </div>

        <div class="calc-bottom-wrapper">
            <button id="btn-confirm-transaction" class="btn-confirm-calc gave">تأكيد</button>
            
            <div class="calculator-keys" dir="ltr">
                <button class="calc-btn action-btn en-font" onclick="app.calcInput('AC')">AC</button>
                <button class="calc-btn action-btn en-font" onclick="app.calcInput('DEL')">DEL</button>
                <button class="calc-btn action-btn en-font" onclick="app.calcInput('%')">%</button>
                <button class="calc-btn op-btn en-font" onclick="app.calcInput('/')">÷</button>

                <button class="calc-btn num-btn en-font" onclick="app.calcInput('7')">7</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('8')">8</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('9')">9</button>
                <button class="calc-btn op-btn en-font" onclick="app.calcInput('*')">×</button>

                <button class="calc-btn num-btn en-font" onclick="app.calcInput('4')">4</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('5')">5</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('6')">6</button>
                <button class="calc-btn op-btn en-font" onclick="app.calcInput('-')">-</button>

                <button class="calc-btn num-btn en-font" onclick="app.calcInput('1')">1</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('2')">2</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('3')">3</button>
                <button class="calc-btn op-btn en-font" onclick="app.calcInput('+')">+</button>

                <button class="calc-btn num-btn en-font" onclick="app.calcInput('00')">00</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('0')">0</button>
                <button class="calc-btn num-btn en-font" onclick="app.calcInput('.')">.</button>
                <button class="calc-btn equals-btn en-font" onclick="app.calcInput('=')">=</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
